[package]
name = "wadhu-connect"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Wadhu Connect — WhatsApp Cloud API Tech Provider bridge (Embedded Signup, webhooks, send)"
publish = false

[[bin]]
name = "wadhu-connect"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
