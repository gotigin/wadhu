[package]
name = "wadhu-sms-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
# Declare the oldest Rust this crate supports; CI should test it (docs/CRATES.md § MSRV).
rust-version = "1.85"
description = "HTTP client helpers for Wadhu SMS Gateway and SMS Relay"
publish = false
keywords = []
categories = []

[dependencies]
# External crates only: never a sibling Wadhu crate or app
# (docs/WADHU_VISION_AND_PRINCIPLES.md §3). Prefer `{ workspace = true }`
# for anything listed in the root [workspace.dependencies].

# Browser / Edge (wasm32): async fetch. Native targets need none of these.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Request",
    "RequestInit",
    "RequestMode",
    "Headers",
    "Response",
] }
