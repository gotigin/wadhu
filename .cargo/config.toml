[alias]
# One live-dev alias per app, each backed by its own tools/<app>-dev shim
# (never a shared one). scripts/new-app.sh adds the line for a new app.
#
# Template app desktop live-dev: loads templates/app/env/development.env,
# then runs with --hot --remote (F12).
# Usage: cargo template-app-dev
template-app-dev = ["run", "-p", "template-app-dev", "--"]

# Template app Android live-dev (install + launch on a connected device).
# Usage: cargo template-app-android-dev
template-app-android-dev = ["run", "-p", "template-app-android-dev", "--"]

# Template app Windows cross package (dev app id).
# Usage: cargo template-app-windows-dev
template-app-windows-dev = ["run", "-p", "template-app-windows-dev", "--"]

# SMS Gateway desktop live-dev (apps/sms-gateway, com.wadhu.smsgateway.debug).
# Usage: cargo sms-gateway-dev
sms-gateway-dev = ["run", "-p", "sms-gateway-dev", "--"]

# SMS Gateway Android live-dev (apps/sms-gateway, com.wadhu.smsgateway.debug).
# Usage: cargo sms-gateway-android-dev
sms-gateway-android-dev = ["run", "-p", "sms-gateway-android-dev", "--"]

# SMS Gateway Windows package (apps/sms-gateway, com.wadhu.smsgateway.debug).
# Usage: cargo sms-gateway-windows-dev
sms-gateway-windows-dev = ["run", "-p", "sms-gateway-windows-dev", "--"]

# SMS Relay headless server (apps/sms-relay).
# Usage: cargo sms-relay-dev
# Env: SMS_RELAY_BIND SMS_RELAY_DATA SMS_RELAY_ADMIN_TOKEN
sms-relay-dev = ["run", "-p", "sms-relay-dev", "--"]

# Wadhu Connect (WhatsApp Cloud API bridge) — http://127.0.0.1:3847
# Usage: cargo wadhu-connect-dev
# Env: META_APP_ID META_APP_SECRET META_CONFIG_ID PUBLIC_ORIGIN …
wadhu-connect-dev = ["run", "-p", "wadhu-connect-dev", "--"]

# SMS Client Demo desktop live-dev (apps/sms-client-demo, com.wadhu.smsclientdemo.debug).
# Usage: cargo sms-client-demo-dev — desktop only; library covers other platforms.
sms-client-demo-dev = ["run", "-p", "sms-client-demo-dev", "--"]

# Cross-link the Windows GNU target from Arch (pacman -S mingw-w64-gcc).
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

# Window / taskbar icons for Makepad. Workspace default = the Wadhu brand
# mark (assets/icons/, regenerate with scripts/generate-app-icons.sh). An
# app with its own icons exports MAKEPAD_APP_ICON_* from its scripts/dev.sh;
# Cargo [env] never overrides an exported variable.
[env]
MAKEPAD_APP_ICON_32 = { value = "assets/icons/icon_32.png", relative = true }
MAKEPAD_APP_ICON_64 = { value = "assets/icons/icon_64.png", relative = true }
MAKEPAD_APP_ICON_128 = { value = "assets/icons/icon_128.png", relative = true }
MAKEPAD_APP_ICON_256 = { value = "assets/icons/icon_256.png", relative = true }
MAKEPAD_APP_ICON_512 = { value = "assets/icons/icon_512.png", relative = true }
MAKEPAD_APP_ICON_1024 = { value = "assets/icons/icon_1024.png", relative = true }
MAKEPAD_APP_ICON_ICO = { value = "assets/icons/icon.ico", relative = true }
