[package]
name = "wadhu-template-crate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
# Declare the oldest Rust this crate supports; CI should test it (docs/CRATES.md § MSRV).
rust-version = "1.85"
description = "Starter plain-Rust library crate for Wadhu — copy with scripts/new-crate.sh"
publish = false
readme = "README.md"
keywords = []
categories = []

# Kind for scripts/check-independence.sh (crates/ members get this from their path).
[package.metadata.wadhu]
kind = "crate"

[dependencies]
# External crates only: never a sibling Wadhu crate or app
# (docs/WADHU_VISION_AND_PRINCIPLES.md §3). Prefer `{ workspace = true }`
# for anything listed in the root [workspace.dependencies].
