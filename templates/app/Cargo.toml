[package]
name = "wadhu-template-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Starter Makepad 2 app for Wadhu — copy with scripts/new-app.sh, never depend on it"
publish = false

# Packager metadata is the production id. Dev builds use env/development.env
# (<id>.debug) via scripts — see docs/DEV.md § Env and app ids.
[package.metadata.packager]
identifier = "com.wadhu.template"
product_name = "Wadhu Template"

[package.metadata.makepad.android]
version_code = 1
version_name = "0.1.0"
min_sdk_version = 26

# Kind for scripts/check-independence.sh (apps/ members get this from their path).
[package.metadata.wadhu]
kind = "app"

[dependencies]
makepad-widgets = { workspace = true }
# An app takes Wadhu crates it needs by path, e.g.:
# wadhu-<crate> = { path = "../../crates/<crate>" }
